[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-agent"
version = "0.1.0"
description = "Agentic repair and sync of Serato/foobar2000 playlists - feasibility study (MSIT)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AwaTekoete" }]
dependencies = [
    "pyyaml",          # config/config.yaml lesen
    "python-dotenv",   # .env lesen (Seriennummer, API-Keys)
    "pandas",          # Tabellen, CSV-Ergebnisse
    "matplotlib",      # Grafiken im Store44-Schema (viz_config.py)
    "tinytag",         # Audio-Tags und Dauer nur lesen, MIT-Lizenz (Entscheidung 11.11.2026)
]

[project.optional-dependencies]
dev = ["ipykernel", "nbstripout", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
